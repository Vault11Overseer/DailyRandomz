[project]
name = "backend"
version = "0.1.0"
description = "DailyRandomz facts, accounts, favorites, and preferences API"
readme = "README.md"
authors = [
    { name = "Vault11Overseer", email = "cherokeedreemer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
